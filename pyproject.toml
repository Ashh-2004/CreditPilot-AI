[project]
name = "loaniq"
version = "0.1.0"
description = "Bank Lending Intelligence and Automated Risk Assessment System"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "pandas==2.2.3",
    "plotly==5.24.1",
    "mysql-connector-python==9.7.0",
    "bcrypt==4.2.1",
    "python-dotenv==1.2.2",
    "faker==40.23.0",
    "sqlparse>=0.5.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "joblib>=1.2.0",
    "shap>=0.54.1",
    "google-generativeai>=0.3.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "kagglehub>=1.0.3",
]

[project.optional-dependencies]
legacy-streamlit = [
    "streamlit==1.58.0",
    "streamlit-authenticator==0.4.2",
]
